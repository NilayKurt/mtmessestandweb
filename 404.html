<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found | MT Messe Stand</title>
  <link rel="icon" href="assets/img/favicon.webp">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0d1523; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 20px; }
    .container { max-width: 600px; }
    .code { font-size: 6rem; font-weight: 800; color: #f4b400; line-height: 1; }
    h1 { font-size: 1.8rem; margin: 1rem 0 0.5rem; }
    p { color: #8899aa; font-size: 1.05rem; line-height: 1.6; margin-bottom: 2rem; }
    a { display: inline-block; padding: 12px 32px; background: #f4b400; color: #0d1523; text-decoration: none; border-radius: 8px; font-weight: 600; }
    a:hover { background: #e5a800; }
  </style>
  <script>
    // Detect language from URL and redirect
    var path = window.location.pathname;
    var langMatch = path.match(/^\/(en|tr|de|fr|ar|zh)\//);
    if (langMatch) {
      var lang = langMatch[1];
      window.location.href = '/' + lang + '/404.html';
    } else {
      // Default to EN 404
      window.location.href = '/en/404.html';
    }
  </script>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Redirecting...</h1>
    <p><a href="/en/">Go to Homepage</a></p>
  </div>
</body>
</html>
